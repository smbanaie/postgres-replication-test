version: '3.8'

services:
  # Publisher (Primary Database)
  pg-publisher:
    container_name: pg-publisher
    hostname: pg-publisher
    image: docker.arvancloud.ir/library/postgres:18
    volumes:
      - ./publisher_data:/var/lib/postgresql
      - ./publisher_init:/docker-entrypoint-initdb.d
      - ./backups:/backups
    environment:
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_USER=postgres
      - POSTGRES_DB=company_db
      - POSTGRES_HOST_AUTH_METHOD=md5
    networks:
      - replication_network
    ports:
      - "5433:5432"
    restart: always
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c max_logical_replication_workers=10

  # Subscriber (Replica Database)
  pg-subscriber:
    container_name: pg-subscriber
    hostname: pg-subscriber
    image: docker.arvancloud.ir/library/postgres:18
    volumes:
      - ./subscriber_data:/var/lib/postgresql
      - ./subscriber_init:/docker-entrypoint-initdb.d
      - ./backups:/backups
    environment:
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_USER=postgres
      - POSTGRES_DB=company_db
      - POSTGRES_HOST_AUTH_METHOD=md5
    networks:
      - replication_network
    ports:
      - "5434:5432"
    restart: always
    depends_on:
      - pg-publisher
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c max_logical_replication_workers=10

  # Optional: Second Subscriber for multi-subscriber testing
  pg-subscriber2:
    container_name: pg-subscriber2
    hostname: pg-subscriber2
    image: postgres:18
    profiles:
      - multi-subscriber
    volumes:
      - ./subscriber2_data:/var/lib/postgresql
      - ./subscriber2_init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_USER=postgres
      - POSTGRES_DB=company_db
      - POSTGRES_HOST_AUTH_METHOD=md5
    networks:
      - replication_network
    ports:
      - "5435:5432"
    restart: always
    depends_on:
      - pg-publisher
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10

  # PgAdmin for GUI management
  pgadmin:
    container_name: pgadmin-replication
    hostname: pgadmin-replication
    image: dpage/pgadmin4
    restart: always
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - replication_network

volumes:
  publisher_data:
  subscriber_data:
  subscriber2_data:
  pgadmin_data:

networks:
  replication_network:
    name: postgres_replication_network
    driver: bridge